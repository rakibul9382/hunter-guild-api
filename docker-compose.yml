version: '3.8'

services:
  # 1. The Database Container
  # db:
  #   image: postgres:15-alpine
  #   env_file:
  #     - .env
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  # 2. The Django Web Container
  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
      - static_volume:/app/static # Share static files
      - media_volume:/app/media # Share media uploads
    # ports:
    #   - "8000:8000"
    # environment:
    #   - POSTGRES_DB=guild_db
    #   - POSTGRES_USER=admin
    #   - POSTGRES_PASSWORD=supersecretpassword
    #   - POSTGRES_HOST=db
    #   - POSTGRES_PORT=5432
    env_file:
      # <-- Tell Docker to read the .env file
      - .env
    # depends_on:
    #   - db
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80" # Nginx listens on the standard HTTP port
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - web

  celery:
    build: .
    command: celery -A config worker -l INFO
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      # - db
      - redis
# 3. The Permanent Storage
volumes:
  postgres_data:
  static_volume:
  media_volume:
