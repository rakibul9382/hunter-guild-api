version: '3.8'

services:
  # 1. The Database Container
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # 2. The Django Web Container
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    # environment:
    #   - POSTGRES_DB=guild_db
    #   - POSTGRES_USER=admin
    #   - POSTGRES_PASSWORD=supersecretpassword
    #   - POSTGRES_HOST=db
    #   - POSTGRES_PORT=5432
    env_file:
      # <-- Tell Docker to read the .env file
      - .env
    depends_on:
      - db

# 3. The Permanent Storage
volumes:
  postgres_data:
