name: Nightly Security Log Cleanup Workflow
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
   execute-cleanup:
    runs-on: ubuntu-latest
    steps:
    - name: SSH into production server and run cleanup
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          # 1. Enter the absolute path to your repo root folder on your server
          cd hunter_project
          
          # 2. Wake up your specific virtual environment shell
          # source venv/bin/activate
          
          # 3. Fire the custom management command
          python manage.py clear_old_logs