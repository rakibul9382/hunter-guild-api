{% extends "guild/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Hunter Login</h3>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                    <div class="mt-3 text-center">
                        <small>New Hunter? <a href="{% url 'signup' %}">Create an Account</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
