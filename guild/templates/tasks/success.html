<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounty Posted!</title>
    <style>
        body {
            background-color: #1a1a24;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .success-card {
            background-color: #262635;
            border: 2px solid #d4af37; /* Gold border */
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .icon {
            font-size: 60px;
            margin-bottom: 10px;
        }
        h1 {
            color: #d4af37; /* Gold text */
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.1em;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #d4af37;
            color: #1a1a24;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: bold;
            margin: 0 10px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:hover {
            background-color: #f1c40f;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background-color: transparent;
            color: #d4af37;
            border: 1px solid #d4af37;
        }
        .btn-secondary:hover {
            background-color: rgba(212, 175, 55, 0.1);
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon">📜✨</div>
        <h1>Bounty Posted</h1>
        <p>Your task has been successfully pinned to the board. The guild members have been notified and hunters will be able to accept it shortly.</p>
        
        {% comment %} <a href="{% url 'task_list' %}" class="btn">View Bounties</a> {% endcomment %}
        <a href="{% url 'create_bounty_task' %}" class="btn btn-secondary">Post Another</a>
    </div>

</body>
</html>
